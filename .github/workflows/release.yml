name: Release

# Every merge to main that changes what goes into the image builds, pushes and
# releases it. release-please cannot be used here: the image tag carries the base
# OS, Python and MapProxy versions (trixie-p3.13-mp7.0.0-0.0.13), so the tag is
# composed by scripts/next_release_tag.py from the Dockerfile ARGs plus a global
# revision counter that swi-production-deployment uses to order images.

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - patches/**
      - config.py
      - run.sh
      - health-check.sh
      - mapproxy.yaml.default
      - uwsgi.ini.default
  # Rebuild and release without a code change, for example to pick up base image fixes.
  workflow_dispatch:

permissions:
  contents: read

# Two merges in a row must not compute the same revision.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Build, push and release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the GitHub release
      packages: write # push the image

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compute the release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPOSITORY/tags" --jq '.[].name' > "$RUNNER_TEMP/tags.txt"
          TAG="$(python3 scripts/next_release_tag.py Dockerfile < "$RUNNER_TEMP/tags.txt")"
          echo "Releasing $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=raw,value=latest

      # The image goes first: if the build fails nothing is released, and re-running
      # the workflow recomputes the same tag.
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The default GITHUB_TOKEN does not trigger other workflows, so the image is built
      # above in this same run rather than by docker-build-push.yml on the new tag.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes
